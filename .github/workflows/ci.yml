name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Tests are authored in TypeScript and run via `node --test`, which needs
        # native type stripping (unflagged in Node 22.18+/23.6+). Node 20 silently
        # discovers 0 .ts tests and exits green, so it's excluded from the matrix.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
